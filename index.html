<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<script>
async function main() {
    let pyodide = await loadPyodide();
    
    // حتی numpy و pandas هم کار میکنه!
    await pyodide.loadPackage("numpy");
    pyodide.runPython(`
        import numpy as np
        arr = np.array([1, 2, 3, 4, 5])
        print(arr.mean())
    `);
}
main();
</script>
